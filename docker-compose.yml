services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tylt-feedback-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      PORT: ${PORT:-5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-5001}:${PORT:-5000}"

  api-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tylt-feedback-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      PORT: ${PORT:-5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT_DEV:-5002}:${PORT:-5000}"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
